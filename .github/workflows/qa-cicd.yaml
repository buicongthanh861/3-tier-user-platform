name: CICD QA Workflow

on:
  push:
    branches:
      - qa
    paths:
      - client/**
      - server/**
      - .github/workflows/qa-cicd.yaml

jobs:
  git-leaks:
    name: GitLeaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run GitLeaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0
      - name: Upload GitLeaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
  checkov-terraform:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Checkov
        run: pip install checkov
      
      - name: Run checkov terraform scan
        run: |
          checkov -d . --framework terraform --quiet --output json > checkov-terraform-report.json || true
      
      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn

  checkov-kubernetes:
    name: Checkov Kubernetes Scan
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Checkov
        run: pip install checkov
        
      - name: Run checkov kubernetes scan
        run: |
          checkov -d . --framework kubernetes --quiet --output json > checkov-k8s-report.json || true
        
      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-k8s-report
          path: checkov-k8s-report.json
          if-no-files-found: warn
  checkov-docker:
    name: Checkov Docker Scan
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Checkov
        run: pip install checkov
        
      - name: Run checkov docker scan
        run: |
          checkov -d . --framework dockerfile --quiet --output json > checkov-docker-report.json || true
        
      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-docker-report
          path: checkov-docker-report.json
          if-no-files-found: warn
  
  Trivy-Client-Scan:
    name: Trivy Client Scan
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run verify trivy
        run: |
          trivy --version
          which trivy
      
      - name: Run trivy client scan (Json)
        run: |
          trivy fs ./client --format json --output trivy-client-report.json --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 

      - name: Run trivy client scan (Table)
        run: |
          trivy fs ./client --format table --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 > client-trivy-report.table.txt 

      - name: Upload Trivy report (Json)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-client-report
          path: trivy-client-report.json
          if-no-files-found: warn
      - name: Upload Trivy report (Table)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-client-report-table
          path: client-trivy-report.table.txt
          if-no-files-found: warn
  
  Trivy-Server-Scan:
    name: Trivy Server Scan
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run verify trivy
        run: |
          trivy --version
          which trivy
      
      - name: Run trivy server scan (Json)
        run: |
          trivy fs ./server --format json --output trivy-server-report.json --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 

      - name: Run trivy server scan (Table)
        run: |
          trivy fs ./server --format table --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 > server-trivy-report.table.txt 

      - name: Upload Trivy report (Json)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-server-report
          path: trivy-server-report.json
          if-no-files-found: warn
      - name: Upload Trivy report (Table)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-server-report-table
          path: server-trivy-report.table.txt
          if-no-files-found: warn

  lint-client:
    name: client-lint
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - Trivy-Client-Scan

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present
  
  lint-server:
    name: server-lint
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - Trivy-Server-Scan

    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

  testcase-client:
    name: client-testcase
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - Trivy-Client-Scan

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run testcases
        run: npm test --if-present

  testcase-server:
    name: server-testcase
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - Trivy-Server-Scan

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run testcases
        run: npm test --if-present
  
  sonarqube-scan:
    name: SonarQube Scan(backend/frontend)
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - Trivy-Client-Scan
      - Trivy-Server-Scan
      - lint-client
      - lint-server
      - testcase-client
      - testcase-server
    if: success()

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
    
      - name: Client - Install dependencies & test coverage
        run: |
          npm ci
          npm test -- --coverage || true
        working-directory: ./client

      # Cài dependencies và chạy test cho server
      - name: Server - Install dependencies & test coverage
        run: |
          npm ci
          npm test -- --coverage || true
        working-directory: ./server
      
      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=buicongthanh861_3-tier-user-platform
            -Dsonar.organization=java-woof
            -Dsonar.host.url=https://sonarcloud.io/
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
      
      - name: Upload SonarQube report
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report
          path: |
            .scannerwork/report-task.txt
            sonar-project.properties
          if-no-files-found: warn
  
  client-build:
    name: client-build
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - Trivy-Client-Scan
      - lint-client
      - testcase-client
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: install dependencies
        run: npm ci
        working-directory: ./client
      
      - name: Build client
        run: npm run build --if-present
        working-directory: ./client
  
  docker-backend-build:
    name: build docker image and push
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - Trivy-Server-Scan
      - lint-server
      - testcase-server
  
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version
      
      - name: login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: build and push docker backend image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            congthanh19/3-tier-user-platform-backend:${{ github.sha }}
            congthanh19/3-tier-user-platform-backend:latest
      - name: scan backend image with trivy
        run: |
          docker pull congthanh19/3-tier-user-platform-backend:${{ github.sha }}
          trivy image congthanh19/3-tier-user-platform-backend:${{ github.sha }} --format json --output trivy-backend-report.json --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 || true

      - name: scan backend image with trivy (table)
        run: |
          trivy image congthanh19/3-tier-user-platform-backend:${{ github.sha }} --format table --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 > trivy-backend-report.table.txt || true

      - name: Upload Trivy container reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-container-report
          path: | 
            trivy-backend-report.json
            trivy-backend-report.table.txt
          if-no-files-found: warn
          

  docker-frontend-build:
    name: Build and push Frontend image
    runs-on: ubuntu-latest
    needs:
      - client-build
      - lint-client
      - testcase-client
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./client  
          file: ./client/Dockerfile  
          push: true
          tags: |
            congthanh19/3-tier-user-platform-frontend:${{ github.sha }}
            congthanh19/3-tier-user-platform-frontend:latest
      
      - name: Scan frontend image with Trivy
        run: |
          docker pull congthanh19/3-tier-user-platform-frontend:${{ github.sha }}
          trivy image congthanh19/3-tier-user-platform-frontend:${{ github.sha }} --format json --output trivy-frontend-report.json --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 || true

      - name: Scan frontend image with Trivy (table)
        run: |
          trivy image congthanh19/3-tier-user-platform-frontend:${{ github.sha }} --format table --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 > trivy-frontend-report.table.txt || true

      - name: Upload Trivy container reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-container-report
          path: | 
            trivy-frontend-report.json
            trivy-frontend-report.table.txt
          if-no-files-found: warn

  


  

      
    
        

  

