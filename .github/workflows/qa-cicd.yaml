name: CICD QA Workflow

on:
  push:
    branches:
      - qa
    paths:
      - client/**
      - server/**
      - .github/workflows/qa-cicd.yaml

jobs:
  git-leaks:
    name: GitLeaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run GitLeaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0
      - name: Upload GitLeaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
  checkov-terraform:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Checkov
        run: pip install checkov
      
      - name: Run checkov terraform scan
        run: |
          checkov -d . --framework terraform --quiet --output json > checkov-terraform-report.json || true
      
      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn

  checkov-kubernetes:
    name: Checkov Kubernetes Scan
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Checkov
        run: pip install checkov
        
      - name: Run checkov kubernetes scan
        run: |
          checkov -d . --framework kubernetes --quiet --output json > checkov-k8s-report.json || true
        
      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-k8s-report
          path: checkov-k8s-report.json
          if-no-files-found: warn
  checkov-docker:
    name: Checkov Docker Scan
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Checkov
        run: pip install checkov
        
      - name: Run checkov docker scan
        run: |
          checkov -d . --framework dockerfile --quiet --output json > checkov-docker-report.json || true
        
      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-docker-report
          path: checkov-docker-report.json
          if-no-files-found: warn
  
  trivy-scan:
    name: Trivy Scan (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: git-leaks
    strategy:
      fail-fast: false
      matrix:
        target: [client, server]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Verify Trivy installation
        run: |
          trivy --version
          which trivy
      
      - name: Run Trivy scan (JSON)
        run: |
          trivy fs ./${{ matrix.target }} \
            --format json \
            --output trivy-${{ matrix.target }}-report.json \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 0

      - name: Run Trivy scan (Table)
        run: |
          trivy fs ./${{ matrix.target }} \
            --format table \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 0 > trivy-${{ matrix.target }}-report.table.txt

      - name: Upload Trivy report (JSON)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.target }}-report
          path: trivy-${{ matrix.target }}-report.json
          if-no-files-found: warn

      - name: Upload Trivy report (Table)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.target }}-report-table
          path: trivy-${{ matrix.target }}-report.table.txt
          if-no-files-found: warn

  lint-client:
    name: client-lint
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - trivy-scan

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present
  
  lint-server:
    name: server-lint
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - trivy-scan

    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

  testcase-client:
    name: client-testcase
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - trivy-scan

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run testcases
        run: npm test --if-present

  testcase-server:
    name: server-testcase
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - trivy-scan

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run testcases
        run: npm test --if-present
  
  sonarqube-scan:
    name: SonarQube Scan(backend/frontend)
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - trivy-scan
      - lint-client
      - lint-server
      - testcase-client
      - testcase-server
    if: success()
    continue-on-error: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
    
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
    
      - name: Verify Java version
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          javac -version
      
      - name: setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Client - Install dependencies & test coverage
        run: |
          npm ci
          npm test -- --coverage || true
        working-directory: ./client

      - name: Server - Install dependencies & test coverage
        run: |
          npm ci
          npm test -- --coverage || true
        working-directory: ./server
      
      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        with:
          args: >
            -Dsonar.projectKey=buicongthanh861_3-tier-user-platform
            -Dsonar.organization=java-woof
            -Dsonar.host.url=https://sonarcloud.io/
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

      
      - name: Upload SonarQube report
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report
          path: |
            .scannerwork/report-task.txt
            sonar-project.properties
          if-no-files-found: warn
    
  client-build:
    name: client-build
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - trivy-scan
      - lint-client
      - testcase-client
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: install dependencies
        run: npm ci
        working-directory: ./client
      
      - name: Build client
        run: npm run build --if-present
        working-directory: ./client
  
  docker-backend-build:
    name: build docker image and push 
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - trivy-scan
      - lint-server
      - testcase-server
    timeout-minutes: 20
    if: github.event_name == 'push'
  
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version
      
      - name: Configure AWS credentials 
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: setup QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: build,tag and push docker backend image to amazon ECR
        id: build-backend-image
        env:
          ECR_REGISTRY: 159749281332.dkr.ecr.ap-southeast-1.amazonaws.com
          ECR_REPOSITORY: 3-tier-user-platform-backend
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./server
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags
          trivy image $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} --format json --output trivy-backend-report.json --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 || true

      - name: scan backend image with trivy (table)
        run: |
          trivy image $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} --format table --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 > trivy-backend-report.table.txt || true

      - name: Upload Trivy container reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-container-report
          path: | 
            trivy-backend-report.json
            trivy-backend-report.table.txt
          if-no-files-found: warn
          

  docker-frontend-build:
    name: build docker image and push
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - trivy-scan
      - lint-client
      - testcase-client
    timeout-minutes: 20
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
  
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version
      
      - name: Configure AWS credentials 
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: setup QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: build,tag and push docker backend image to amazon ECR
        id: build-frontend-image
        env:
          ECR_REGISTRY: 159749281332.dkr.ecr.ap-southeast-1.amazonaws.com
          ECR_REPOSITORY: 3-tier-user-platform-frontend
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./client
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags
          trivy image $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} --format json --output trivy-frontend-report.json --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 || true

      - name: scan frontend image with trivy (table)
        run: |
          trivy image $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} --format table --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 > trivy-frontend-report.table.txt || true

      - name: Upload Trivy container reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-container-report
          path: | 
            trivy-frontend-report.json
            trivy-frontend-report.table.txt
          if-no-files-found: warn
  

  


  


  

      
    
        

  

