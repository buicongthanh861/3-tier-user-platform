name: CICD QA Workflow

on:
  push:
    branches:
      - qa
    paths:
      - client/**
      - server/**
      - .github/workflows/qa-cicd.yaml

jobs:
  git-leaks:
    name: GitLeaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run GitLeaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0
      - name: Upload GitLeaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
  
  checkov-docker:
    name: Checkov Docker Scan
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Checkov
        run: pip install checkov
        
      - name: Run checkov docker scan
        run: |
          checkov -d . --framework dockerfile --quiet --output json > checkov-docker-report.json || true
        
      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-docker-report
          path: checkov-docker-report.json
          if-no-files-found: warn
  
  trivy-scan:
    name: Trivy Scan (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: git-leaks
    strategy:
      fail-fast: false
      matrix:
        target: [client, server]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Verify Trivy installation
        run: |
          trivy --version
          which trivy
      
      - name: Run Trivy scan (JSON)
        run: |
          trivy fs ./${{ matrix.target }} \
            --format json \
            --output trivy-${{ matrix.target }}-report.json \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 0

      - name: Run Trivy scan (Table)
        run: |
          trivy fs ./${{ matrix.target }} \
            --format table \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 0 > trivy-${{ matrix.target }}-report.table.txt

      - name: Upload Trivy report (JSON)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.target }}-report
          path: trivy-${{ matrix.target }}-report.json
          if-no-files-found: warn

      - name: Upload Trivy report (Table)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.target }}-report-table
          path: trivy-${{ matrix.target }}-report.table.txt
          if-no-files-found: warn

  lint-client:
    name: client-lint
    runs-on: ubuntu-latest
    needs:
      - checkov-docker
      - trivy-scan

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present
  
  lint-server:
    name: server-lint
    runs-on: ubuntu-latest
    needs:
      - checkov-docker
      - trivy-scan

    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

  testcase-client:
    name: client-testcase
    runs-on: ubuntu-latest
    needs:
      - checkov-docker
      - trivy-scan

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run testcases
        run: npm test --if-present

  testcase-server:
    name: server-testcase
    runs-on: ubuntu-latest
    needs:
      - checkov-docker
      - trivy-scan

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run testcases
        run: npm test --if-present
  
