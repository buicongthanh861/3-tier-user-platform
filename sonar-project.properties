sonar.projectKey=buicongthanh861_3-tier-user-platform
sonar.organization=java-woof
sonar.host.url=https://sonarcloud.io

# Quét toàn bộ source code (bao gồm cả client và server)
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/*.test.js

# Chỉ định đường dẫn file coverage cho cả client và server (quan trọng nhất)
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info,server/coverage/lcov.info
