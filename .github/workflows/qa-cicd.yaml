name: CICD QA Workflow

on:
  push:
    branches:
      - qa
    paths:
      - client/**
      - server/**
      - .github/workflows/qa-cicd.yaml

jobs:
  git-leaks:
    name: GitLeaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run GitLeaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0
      - name: Upload GitLeaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
  checkov-terraform:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Checkov
        run: pip install checkov
      
      - name: Run checkov terraform scan
        run: |
          checkov -d . --framework terraform --quiet --output json > checkov-terraform-report.json || true
      
      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn

  checkov-kubernetes:
    name: Checkov Kubernetes Scan
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Checkov
        run: pip install checkov
        
      - name: Run checkov kubernetes scan
        run: |
          checkov -d . --framework kubernetes --quiet --output json > checkov-k8s-report.json || true
        
      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-k8s-report
          path: checkov-k8s-report.json
          if-no-files-found: warn
  checkov-docker:
    name: Checkov Docker Scan
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Checkov
        run: pip install checkov
        
      - name: Run checkov docker scan
        run: |
          checkov -d . --framework dockerfile --quiet --output json > checkov-docker-report.json || true
        
      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-docker-report
          path: checkov-docker-report.json
          if-no-files-found: warn
  
  Trivy-Client-Scan:
    name: Trivy Client Scan
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install trivy
        uses: aquasecurity/trivy-action@master

      - name: Run verify trivy
        run: |
          trivy --version
          which trivy
      
      - name: Run trivy client scan (Json)
        run: |
          trivy fs ./client --format json --output trivy-client-report.json --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 

      - name: Run trivy client scan (Table)
        run: |
          trivy fs ./client --format table --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 > client-trivy-report.table.txt 

      - name: Upload Trivy report (Json)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-client-report
          path: trivy-client-report.json
          if-no-files-found: warn
      - name: Upload Trivy report (Table)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-client-report-table
          path: client-trivy-report.table.txt
          if-no-files-found: warn
  
  Trivy-Server-Scan:
    name: Trivy Server Scan
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install trivy
        uses: aquasecurity/trivy-action@master

      - name: Run verify trivy
        run: |
          trivy --version
          which trivy
      
      - name: Run trivy server scan (Json)
        run: |
          trivy fs ./server --format json --output trivy-server-report.json --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 

      - name: Run trivy server scan (Table)
        run: |
          trivy fs ./server --format table --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 > server-trivy-report.table.txt 

      - name: Upload Trivy report (Json)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-server-report
          path: trivy-server-report.json
          if-no-files-found: warn
      - name: Upload Trivy report (Table)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-server-report-table
          path: server-trivy-report.table.txt
          if-no-files-found: warn

  lint-client:
    name: client-lint
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - Trivy-Client-Scan

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present
  
  lint-server:
    name: server-lint
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - Trivy-Server-Scan

    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

  testcase-client:
    name: client-testcase
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - Trivy-Client-Scan

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run testcases
        run: npm test --if-present

  testcase-server:
    name: server-testcase
    runs-on: ubuntu-latest
    needs:
      - checkov-terraform
      - checkov-kubernetes
      - checkov-docker
      - Trivy-Server-Scan

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run testcases
        run: npm test --if-present
        

  

