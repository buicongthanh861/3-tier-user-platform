  client-build:
    name: client-build
    runs-on: ubuntu-latest
    needs:
      - checkov-docker
      - trivy-scan
      - lint-client
      - testcase-client
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: install dependencies
        run: npm ci
        working-directory: ./client
      
      - name: Build client
        run: npm run build --if-present
        working-directory: ./client
  
  docker-backend-build:
    name: build docker image backend
    runs-on: ubuntu-latest
    needs:
      - checkov-docker
      - trivy-scan
      - lint-server
      - testcase-server
    timeout-minutes: 20
    if: github.event_name == 'push'
  
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version
      
      - name: Configure AWS credentials 
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: setup QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: build,tag and push docker backend image to amazon ECR
        id: build-backend-image
        env:
          ECR_REGISTRY: 159749281332.dkr.ecr.ap-southeast-1.amazonaws.com
          ECR_REPOSITORY: 3-tier-user-platform-backend
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./server
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags
          trivy image $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} --format json --output trivy-backend-report.json --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 || true

      - name: scan backend image with trivy (table)
        run: |
          trivy image $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} --format table --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 > trivy-backend-report.table.txt || true

      - name: Upload Trivy container reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-container-report
          path: | 
            trivy-backend-report.json
            trivy-backend-report.table.txt
          if-no-files-found: warn
          

  docker-frontend-build:
    name: build docker image frontend
    runs-on: ubuntu-latest
    needs:
      - checkov-docker
      - trivy-scan
      - lint-client
      - testcase-client
    timeout-minutes: 20
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
  
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version
      
      - name: Configure AWS credentials 
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: setup QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: build,tag and push docker backend image to amazon ECR
        id: build-frontend-image
        env:
          ECR_REGISTRY: 159749281332.dkr.ecr.ap-southeast-1.amazonaws.com
          ECR_REPOSITORY: 3-tier-user-platform-frontend
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./client
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags
          trivy image $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} --format json --output trivy-frontend-report.json --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 || true

      - name: scan frontend image with trivy (table)
        run: |
          trivy image $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} --format table --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 > trivy-frontend-report.table.txt || true

      - name: Upload Trivy container reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-container-report
          path: | 
            trivy-frontend-report.json
            trivy-frontend-report.table.txt
          if-no-files-found: warn
  
  update-gitops-manifest:
    name: update git values for ArgoCD
    runs-on: ubuntu-latest
    needs:
      - docker-frontend-build
      - docker-backend-build
    permissions:
      contents: write
    timeout-minutes: 20
    
    steps:
      - name: Checkout IAC repo
        uses: actions/checkout@v4
        with:
          repository: buicongthanh861/3-tier-user-platform-iac
          token: ${{ secrets.IAC_REPO_PAT }}
          path: iac-repo
      
      - name: Debug repo
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== List files ==="
          ls -la
          echo "=== IAC repo files ==="
          ls -la iac-repo
          echo "=== Current branch ==="
          cd iac-repo
          git branch
          pwd

      - name: Setup yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
          yq --version

      - name: Show values before update
        run: |
          echo "=== FRONTEND BEFORE ==="
          cat iac-repo/k8s/frontend/values.yaml
          echo "=== BACKEND BEFORE ==="
          cat iac-repo/k8s/backend/values.yaml

      - name: Update image tags
        run: |
          cd iac-repo
          yq e -i ".image.tag = \"${GITHUB_SHA}\"" ./k8s/frontend/values.yaml
          yq e -i ".image.tag = \"${GITHUB_SHA}\"" ./k8s/backend/values.yaml

      - name: Show values after update
        run: |
          echo "=== FRONTEND AFTER ==="
          cat iac-repo/k8s/frontend/values.yaml
          echo "=== BACKEND AFTER ==="
          cat iac-repo/k8s/backend/values.yaml

      - name: Commit and push changes
        run: |
          cd iac-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/frontend/values.yaml k8s/backend/values.yaml

          if git diff --cached --quiet; then
            echo "No image tag changes to commit"
          else
            git commit -m "chore: update image tag ${GITHUB_SHA}"
            git push origin HEAD:master
          fi

  

  


  


  

      
    
        

  

